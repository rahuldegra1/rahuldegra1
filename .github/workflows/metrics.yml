name: Metrics

on:
  schedule:
    # Refresh every 24 hours at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ──────────────────────────────────────────────────
      # 1. Core stats: header + languages + habits + lines
      # ──────────────────────────────────────────────────
      - name: Core Stats (Languages · Habits · Lines)
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: rahuldegra1
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large

          # Languages breakdown
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Coding habits & active hours
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          # Lines of code (added / removed)
          plugin_lines: yes
          plugin_lines_history_limit: 1

      # ──────────────────────────────────────────────────
      # 2. Isometric 3D commit calendar (half-year)
      # ──────────────────────────────────────────────────
      - name: Isometric 3D Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: rahuldegra1
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ──────────────────────────────────────────────────
      # 3. Achievements & Topics (single SVG)
      # ──────────────────────────────────────────────────
      - name: Achievements & Starred Topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: rahuldegra1
          template: classic
          base: ""
          config_timezone: Asia/Kolkata

          # GitHub achievement badges
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: X

          # Starred topics / interests
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: mastered
          plugin_topics_sort: stars

      # ──────────────────────────────────────────────────
      # 4. Recent Activity feed
      # ──────────────────────────────────────────────────
      - name: Recent Activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.activity.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: rahuldegra1
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_timestamps: yes
          plugin_activity_visibility: all
